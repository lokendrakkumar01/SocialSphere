version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: socialsphere-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: socialsphere
    volumes:
      - mongo_data:/data/db

  server:
    build:
      context: ./server
      dockerfile: ../Dockerfile.server
    container_name: socialsphere-server
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - APP_NAME=SocialSphere
      - CLIENT_URL=http://localhost:5173
      - MONGODB_URI=mongodb://mongodb:27017/socialsphere
      - JWT_ACCESS_SECRET=socialsphere_prod_access_secret_key_2026_x!
      - JWT_REFRESH_SECRET=socialsphere_prod_refresh_secret_key_2026_z!
      - UPLOAD_DIR=uploads
      - MAX_FILE_SIZE_MB=50
    depends_on:
      - mongodb
    volumes:
      - server_uploads:/app/uploads

  client:
    build:
      context: ./client
      dockerfile: ../Dockerfile.client
    container_name: socialsphere-client
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - server

volumes:
  mongo_data:
  server_uploads:
